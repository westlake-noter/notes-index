name: Build and Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Root Markdown files are repository documentation, not site content.
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      refresh_repositories:
        description: Refresh upstream repository snapshots even when cached
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore compilation cache
        uses: actions/cache/restore@v4
        id: compilation-cache
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-${{ runner.arch }}-node22-build-v2-${{ hashFiles('package-lock.json', 'docusaurus.config.js', 'sidebars.js', '.github/workflows/pages.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-build-v2-${{ hashFiles('package-lock.json', 'docusaurus.config.js', 'sidebars.js', '.github/workflows/pages.yml') }}-
      - name: Restore repository snapshots
        uses: actions/cache/restore@v4
        with:
          path: .cache/repositories
          key: repository-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repository-snapshots-v1-
      - run: npm test
      - name: Sync linked repository contributors and documents
        run: npm run sync:repositories
        if: ${{ !inputs.refresh_repositories }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Force refresh linked repositories
        if: ${{ inputs.refresh_repositories }}
        run: npm run sync:repositories -- --force
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      - name: Save repository snapshots
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/repositories
          key: repository-snapshots-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compilation cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this is still the latest main commit
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            const current = context.ref === 'refs/heads/main' &&
              data.object.sha === context.sha;
            core.setOutput('current', current);
            if (!current) {
              core.notice('Skipping deployment: this run is not the latest main commit.');
            }
      - name: Deploy
        if: steps.latest.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
